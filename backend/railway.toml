# Railway — repo: mouuuux1z/final-01
# Branch: main
# Root Directory: (empty) — do NOT use "backend"
# Builder: Nixpacks (no Dockerfile)

[build]
builder = "NIXPACKS"
buildCommand = "NPM_CONFIG_PRODUCTION=false npm install && npm run production:build"

[deploy]
startCommand = "npm run production:start"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
