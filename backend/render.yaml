# Render: repo final-01, branch main
# Root Directory في لوحة Render = فارغ (لا تكتب src ولا backend)
services:
  - type: web
    name: mydoc-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run production:build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_FILE_SIZE
        value: "5242880"
