services:
  postgres:
    image: postgres:16-alpine
    container_name: mydoc-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mydoc
      POSTGRES_PASSWORD: mydoc_secret
      POSTGRES_DB: mydoc_db
    volumes:
      - mydoc_pg_data:/var/lib/postgresql/data

volumes:
  mydoc_pg_data:
